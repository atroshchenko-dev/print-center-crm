name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # The Node the server builds with. CI ran on 22 while production runs the
  # NodeSource 20 package in /usr/bin, so the bundle CI proved buildable was
  # not the bundle production produces — and a build that only fails on the
  # server leaves the code deployed and the assets stale.
  #
  # Node 20 left LTS support in April 2026. Moving to 22 was a server change
  # plus this line, in that order — and it was done in that order: the server
  # took `v22.23.2` from NodeSource on 2026-08-02 and built the frontend by
  # hand before this line moved (`✓ built in 11.74s`). Doing it the other way
  # round would have put the lie back: CI proving a bundle production cannot
  # produce.
  NODE_VERSION: '22'

  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: crm_print_test
  DB_USERNAME: crm
  DB_PASSWORD: secret
  CACHE_STORE: array
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: array
  MAIL_MAILER: array

jobs:
  phpunit:
    name: PHPUnit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm_print_test
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U crm"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      # The Redis production runs. This said 7 while the server runs 6, which is
      # the same lie the NODE_VERSION comment above was written to remove: a CI
      # that proves the suite green on software production does not have.
      #
      # Nothing here needs a Redis 7 feature — cache and queue through predis —
      # so the cheap direction is CI down to production, not production up to
      # CI. Raising the server to 7 later is a server change first and this line
      # second, in that order, exactly as Node 20 → 22 was done on 2026-08-02.
      #
      # Found by reading the documents rather than the code, round 35.
      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # Full history: the Pint step below diffs against the base ref, and the
      # default depth of 1 leaves neither the base commit nor HEAD^ in the
      # clone — the diff would come back empty and the style gate would pass
      # without having looked at anything.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, mbstring, xml, curl, gd
          coverage: xdebug

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npx vitest run --config vitest.config.js
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # Override phpunit.xml DB_HOST (it has 'postgres' for Docker)
          sed -i 's/DB_HOST" value="postgres"/DB_HOST" value="127.0.0.1"/' phpunit.xml

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml --coverage-clover clover.xml

      - name: Static analysis (PHPStan level 5)
        if: always()
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      # Style on what this change touched, not on the whole tree.
      #
      # Owner's decision, 2026-07-31: 351 of 386 files fail `pint --test`, and
      # formatting them in one commit would put `git blame` on that commit for
      # most lines of the project — on a codebase where this audit has leaned on
      # `blame` and `log -S` dozens of times, including to prove a button had
      # never existed in any commit. So new code holds the line and the old
      # files come along as they are touched.
      #
      # NOT `pint --dirty`: that means "files with uncommitted changes", and a
      # CI checkout is clean, so it would inspect nothing and pass forever — a
      # gate that cannot fail, which is exactly C-1. The changed files are
      # computed against the base ref instead, and the step says out loud when
      # there are none.
      - name: Code style (Pint, changed files only)
        if: always()
        run: |
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base ref ($base) — checking the files of this commit."
            base="HEAD^"
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.php' | tr '\n' ' ')
          if [ -z "$files" ]; then
            echo "No PHP files changed — nothing to check."
            exit 0
          fi
          echo "Checking: $files"
          vendor/bin/pint --test $files

      - name: Security audit (composer)
        if: always()
        run: composer audit --no-interaction

      # The audit report has tracked `npm audit --omit=dev` as a number since
      # round 1 and nothing kept it there — only the PHP side was gated. A
      # figure in a report that no gate enforces is the class this audit has
      # found seven times.
      #
      # --omit=dev on purpose: only what ships. Dev-only advisories in the
      # build toolchain are not on the server.
      - name: Security audit (npm, production deps)
        if: always()
        run: npm audit --omit=dev

      - name: Coverage summary
        if: always()
        run: |
          if [ -f clover.xml ]; then
            COVERAGE=$(php -r '
              $xml = simplexml_load_file("clover.xml");
              $metrics = $xml->project->metrics;
              $stmts = (int)$metrics["statements"];
              $covered = (int)$metrics["coveredstatements"];
              echo $stmts > 0 ? round($covered / $stmts * 100, 1) : 0;
            ')
            echo "📊 Code Coverage: **${COVERAGE}%**" >> $GITHUB_STEP_SUMMARY
          fi

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: phpunit

    # The workflow-level SESSION_DRIVER=array is right for PHPUnit and fatal
    # here: an array session lives for one request, so a browser can never stay
    # signed in. That is why every authenticated e2e test skipped (and, before
    # they were honest about it, passed while signed out).
    env:
      SESSION_DRIVER: file

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm_print_test
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U crm"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, mbstring, xml, curl, gd
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          composer config --global --unset github-oauth.github.com || true
          composer install --no-interaction --prefer-dist
          npm ci --no-audit --no-fund

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations & seed
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: Build assets
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start server
        run: php artisan serve --port=8000 &
        env:
          APP_URL: http://localhost:8000

      - name: Wait for server
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/ping && break || sleep 2
          done

      - name: Run Playwright tests
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8000

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
